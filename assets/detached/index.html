<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<!--
  The window is the same page the panel is: it loads the plugin's own client.js
  and the shim that stands in for DSH while that module mounts. Everything is
  same-origin (the Host serves this file), so no remote origin is reachable and
  no inline script is needed.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';">
<title>会话资源管理器</title>
<!-- The same folder mark package.json gives the plugin, so the window's tab,
     taskbar entry and the plugin list all show one icon. -->
<link rel="icon" type="image/png" href="/session-navigator/api/ui/icon.png">
<link rel="stylesheet" href="/session-navigator/api/ui/window.css">
</head>
<body>
<div id="root">
  <div class="boot">
    <div class="boot-title">会话资源管理器</div>
    <div class="boot-sub" id="boot-sub">正在启动…</div>
  </div>
</div>
<script src="/session-navigator/api/ui/react.js"></script>
<script src="/session-navigator/api/ui/react-dom.js"></script>
<script src="/session-navigator/api/ui/shim.js"></script>
<script src="/session-navigator/api/ui/client.js"></script>
</body>
</html>
